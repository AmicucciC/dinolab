<style>
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Nunito', sans-serif; overflow-x: hidden; }
button { cursor: pointer; border: none; font-family: 'Fredoka', sans-serif; }
button:active { transform: scale(0.96) !important; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
@keyframes dinoFloat { from { transform: translateY(0); } to { transform: translateY(-14px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dinoWalk { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
@keyframes richtig { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 30% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } 70% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1); } }

.topic { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; border-radius:18px; background:white; border:2px solid #eee; text-align:left; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
.topic .em { font-size:30px; width:40px; text-align:center; flex-shrink:0; }
.topic .t { font-family:'Fredoka',sans-serif; font-size:18px; font-weight:600; color:#2E4057; }
.topic .s { font-family:'Nunito',sans-serif; font-size:13px; color:#888; font-weight:600; }
.topic .stars { margin-left:auto; font-size:13px; color:#F9A825; font-weight:700; font-family:'Fredoka',sans-serif; white-space:nowrap; }
.opt { padding:16px 10px; border-radius:18px; font-size:22px; font-weight:600; color:white; min-width:90px; flex:1; box-shadow:0 4px 12px rgba(0,0,0,.12); }
.optw { padding:14px 14px; border-radius:16px; font-size:20px; font-weight:600; color:#2E4057; background:white; border:3px solid #e0e0e0; width:100%; margin-bottom:10px; text-transform:none; }
.word { display:inline-block; padding:8px 10px; margin:4px 3px; border-radius:12px; background:white; border:2px solid #e0e0e0; font-family:'Nunito',sans-serif; font-size:19px; font-weight:700; color:#2E4057; }
.word.sel { background:#FFF3C4; border-color:#F9A825; }
.word.ok { background:#D5F5E3; border-color:#27AE60; color:#1E8449; }
.word.miss { background:#FDEBD0; border-color:#E67E22; color:#A04000; }
.word.bad { background:#FADBD8; border-color:#E74C3C; color:#922B21; text-decoration:line-through; }
.speak { background:#f3f0ff; color:#6C5CE7; border-radius:12px; padding:6px 10px; font-size:18px; }
</style>

const today = () => new Date().toISOString().slice(0,10);

function loadData() {
  let d = null;

  d = d || {};

  d.mistakes = d.mistakes || {}; // chiave -> quante volte sbagliata
  d.streak = d.streak || 0;
  d.lastDate = d.lastDate || null;
  d.rounds = d.rounds || 0;
  return d;
}
function saveData() { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e) {} }

// --- Voce tedesca ---
// Usa SOLO una voce tedesca vera: se il dispositivo non ce l'ha, meglio stare zitti
// che leggere il tedesco con la voce italiana.
let deVoice = null, voicesChecked = false;
function loadVoices() {
  try {
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    if (!vs.length) return;
    voicesChecked = true;
    const de = vs.filter(v => /^de([-_]|$)/i.test(v.lang||""));
    deVoice = de.find(v=>/de[-_]DE/i.test(v.lang) && /google|anna|helena|petra|markus|yannick|katja|conrad/i.test(v.name))
           || de.find(v=>/de[-_]DE/i.test(v.lang)) || de[0] || null;
    if (state === "menu") render();
  } catch(e) {}
}
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 800);
}
function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    if (!deVoice) loadVoices();
    if (!deVoice) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = deVoice; u.lang = deVoice.lang; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch(e) {}
}

function splitArt(s){ const i=s.indexOf(" "); return [s.slice(0,i), s.slice(i+1)]; }

function qArtikel(entry) {
  const [art, noun] = splitArt(entry);
  return { kind:"choice", key:"art:"+noun, topic:"artikel", rule:"artikel",
    ask:"Quale articolo?", big:`<span style="color:#bbb">___</span> ${esc(noun)}`, say:entry,
    options:["der","die","das"].map(a=>({label:a, value:a, color:ART_COLOR[a]})), answer:art, row:true,
    solution:`<b style="color:${ART_COLOR[art]}">${art}</b> ${esc(noun)}` };
}
function qEin(entry) {
  const [ein, noun] = splitArt(entry);
  const full = NOUNS.find(n=>splitArt(n)[1]===noun);
  const art = full ? splitArt(full)[0] : (ein==="eine"?"die":"das");
  return { kind:"choice", key:"art:"+noun, topic:"artikel", rule:"ein",
    ask:"Cambia l'articolo indeterminativo con quello determinativo", big:`${esc(entry)} → <span style="color:#bbb">___</span> ${esc(noun)}`, say:entry,
    options:["der","die","das"].map(a=>({label:a, value:a, color:ART_COLOR[a]})), answer:art, row:true,
    solution:`${esc(entry)} → <b style="color:${ART_COLOR[art]}">${art}</b> ${esc(noun)}` };
}
function qWortart([w,t]) {
  return { kind:"choice", key:"wa:"+w, topic:"wortart", rule:"wortart",
    ask:"Che tipo di parola è?", big:esc(w.toLowerCase()), say:w, hint:"(è scritta tutta in minuscolo apposta 😉)",
    options:["N","V","A"].map(k=>({label:`${WORTART_INFO[k].emoji} ${WORTART_INFO[k].label}`, value:k, color:WORTART_INFO[k].color})),
    answer:t, row:false,
    solution:`<b>${esc(w)}</b> è un <b style="color:${WORTART_INFO[t].color}">${WORTART_INFO[t].label}</b>${t==="V"&&VERB_BASE[w]?` (da <i>${VERB_BASE[w]}</i>)`:""}${t==="N"?" → si scrive con la maiuscola!":""}` };
}
function qGross(s) {
  const tokens = s.split(" ").map(tok => {
    const noun = tok.startsWith("*");
    const raw = noun ? tok.slice(1) : tok;
    const m = raw.match(/^([\wÄÖÜäöüß]+)(.*)$/);
    return { word: m ? m[1] : raw, punct: m ? m[2] : "", noun };
  });
  return { kind:"tap", key:"gr:"+s.slice(0,30), topic:"gross", rule:"gross", tokens, say:s.replace(/\*/g,"") };
}
function qEndung([art, stem, end, base]) {
  return { kind:"choice", key:"en:"+stem, topic:"endung", rule:"endung",
    ask:"Quale finale ci vuole?", big:`<span style="font-size:20px;color:#888">${esc(base)} →</span><br>${art} ${esc(stem)}<span style="color:#bbb">___</span>`, say:`${art} ${stem}${end}`,
    options:shuffle(["heit","keit","nis","ung"]).map(e=>({label:"-"+e, value:e, color:"#8E44AD"})), answer:end, row:true,
    solution:`${art} ${esc(stem)}<b style="color:#8E44AD">${end}</b>` };
}
function qPlural([sing, pl, d1, d2]) {
  if (Math.random() < 0.6) {
    return { kind:"choice", key:"pl:"+sing, topic:"plural", rule:"plural",
      ask:"Qual è la Mehrzahl (plurale)?", big:`${esc(sing)} → die <span style="color:#bbb">___</span>`, say:`${sing}, die ${pl}`,
      options:shuffle([pl,d1,d2]).map(x=>({label:"die "+x, value:x})), answer:pl, row:false, words:true,
      solution:`${esc(sing)} → <b style="color:#C0392B">die ${esc(pl)}</b>` };
  }
  const [art, noun] = splitArt(sing);
  return { kind:"choice", key:"pl:"+sing, topic:"plural", rule:"singular",
    ask:"Qual è la Einzahl (singolare)?", big:`die ${esc(pl)} → <span style="color:#bbb">___</span> ${esc(noun)}`, say:`die ${pl}, ${sing}`,
    options:["der","die","das"].map(a=>({label:a+" "+noun, value:a, color:ART_COLOR[a]})), answer:art, row:false,
    solution:`die ${esc(pl)} → <b style="color:${ART_COLOR[art]}">${art}</b> ${esc(noun)}` };
}
function qMitEinem([n, v, ok]) {
  return { kind:"choice", key:"me:"+v, topic:"verben", rule:"mitEinem",
    ask:"Giusto o sbagliato?", big:`<span style="font-size:24px">Mit ${esc(n)} kann man <b>${esc(v)}</b>?</span>`, say:`Mit ${n} kann man ${v}?`,
    options:[{label:"✔ Ja", value:true, color:"#27AE60"},{label:"✘ Nein", value:false, color:"#E74C3C"}], answer:ok, row:true,
    solution: ok ? `<b style="color:#27AE60">Ja!</b> Mit ${esc(n)} kann man ${esc(v)}.` : `<b style="color:#E74C3C">Nein!</b> „${esc(v)}" non esiste!` };
}
function qVerbNomen([v, good, ...bad]) {
  return { kind:"choice", key:"vn:"+v, topic:"verben", rule:"verbNomen",
    ask:"Quale Nomen viene da questo verbo?", big:esc(v), say:`${v}, ${good}`,
    options:shuffle([good,...bad]).map(x=>({label:x, value:x})), answer:good, row:false, words:true,
    solution:`${esc(v)} → <b style="color:#16A085">${esc(good)}</b>` };
}
function qNominal([orig, gap, good, ...bad]) {
  return { kind:"choice", key:"nm:"+orig, topic:"verben", rule:"nominal",
    ask:"Riscrivi la frase: quale parola ci va?", big:`<span style="font-size:17px;color:#888;font-weight:600">${esc(orig)}</span><br><span style="font-size:22px">${esc(gap).replace("___",'<span style="color:#bbb">_____</span>')}</span>`, say:gap.replace("___",good),
    options:shuffle([good,...bad]).map(x=>({label:x, value:x})), answer:good, row:false, words:true,
    solution:esc(gap).replace("___",`<b style="color:#16A085">${esc(good)}</b>`) };
}

// Pesca: privilegia le parole sbagliate prima (dati salvati) e quelle difficili dal quaderno
function weightedPick(list, keyOf, hardTest, n) {
  const scored = list.map(it => {
    const k = keyOf(it);
    let w = 1 + (data.mistakes[k]||0) * 3 + (hardTest && hardTest(it) ? 2 : 0);
    return {it, r: Math.random() * w};
  });
  return scored.sort((a,b)=>b.r-a.r).slice(0,n).map(x=>x.it);
}

function genTopic(id, n) {
  switch(id) {
    case "artikel": {
      const nE = Math.round(n*0.3);
      const a = weightedPick(NOUNS, e=>"art:"+splitArt(e)[1], e=>HARD_NOUNS.includes(splitArt(e)[1]), n-nE).map(qArtikel);
      const b = weightedPick(EIN, e=>"art:"+splitArt(e)[1], e=>HARD_NOUNS.includes(splitArt(e)[1]), nE).map(qEin);
      return [...a,...b];
    }
    case "wortart": return weightedPick(WORTARTEN, e=>"wa:"+e[0], e=>HARD_WORTART.includes(e[0]), n).map(qWortart);
    case "gross": return weightedPick(SENTENCES, s=>"gr:"+s.slice(0,30), null, n).map(qGross);
    case "endung": return weightedPick(ENDUNGEN, e=>"en:"+e[1], null, n).map(qEndung);
    case "plural": return weightedPick(PLURALS, e=>"pl:"+e[0], e=>HARD_PLURALS.includes(e[0]), n).map(qPlural);
    case "verben": {
      const n1 = Math.ceil(n*0.4), n2 = Math.ceil(n*0.3), n3 = n-n1-n2;
      return [
        ...weightedPick(MIT_EINEM, e=>"me:"+e[1], null, n1).map(qMitEinem),
        ...weightedPick(VERB_ZU_NOMEN, e=>"vn:"+e[0], null, n2).map(qVerbNomen),
        ...weightedPick(NOMINAL, e=>"nm:"+e[0], null, n3).map(qNominal),
      ];
    }
  }
  return [];
}
function genRound(id) {
  if (id === "mix") {
    const parts = {artikel:3, wortart:2, gross:1, endung:1, verben:1, plural:2};
    let all = [];
    for (const [t,n] of Object.entries(parts)) all = all.concat(genTopic(t,n));
    return shuffle(all);
  }
  return shuffle(genTopic(id, TOTAL));
}

function flashRichtig(cb) {
  const el = $("#richtig");
  el.textContent = pick(RICHTIG);
  el.style.display = "block";
  el.style.animation = "none"; void el.offsetWidth;
  el.style.animation = "richtig .9s ease forwards";

function celebrate(cb) {
  const canvas = $("#confetti-canvas");
  canvas.style.display="block";
  const ctx = canvas.getContext("2d");
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const colors=["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#FF9FF3","#54A0FF"];
  const parts=[];
  for(let i=0;i<120;i++) parts.push({
    x:canvas.width/2+(Math.random()-.5)*200, y:canvas.height/2,
    vx:(Math.random()-.5)*16, vy:-Math.random()*18-4,
    sz:Math.random()*10+4, c:pick(colors),
    sh:pick(["c","r","s","t"]), rot:Math.random()*Math.PI*2,
    rs:(Math.random()-.5)*.3, g:.25+Math.random()*.15, life:1, dec:.008+Math.random()*.006
  });
  const fd=$("#flying-dino");
  fd.textContent=pick(CELEB_ITEMS);
  fd.style.display="block"; fd.style.left="-80px"; fd.style.top=(canvas.height*.3+Math.random()*100)+"px";
  let fx=-80, frame=0;
  function anim() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    for(const p of parts) {
      if(p.life<=0)continue; alive=true;
      p.x+=p.vx; p.vy+=p.g; p.y+=p.vy; p.vx*=.99; p.rot+=p.rs; p.life-=p.dec;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.sh==="c"){ctx.beginPath();ctx.arc(0,0,p.sz,0,Math.PI*2);ctx.fill();}
      else if(p.sh==="r"){ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);}
      else if(p.sh==="s"){drawStar(ctx,0,0,5,p.sz,p.sz/2);ctx.fill();}
      else{ctx.beginPath();ctx.moveTo(0,-p.sz);ctx.lineTo(p.sz,p.sz);ctx.lineTo(-p.sz,p.sz);ctx.closePath();ctx.fill();}
      ctx.restore();
    }
    fx+=5; fd.style.left=fx+"px";
    fd.style.animation = "dinoFloat 0.5s ease-in-out infinite alternate";
    frame++;
    if(alive||frame<120) requestAnimationFrame(anim);
    else { canvas.style.display="none"; fd.style.display="none"; cb(); }
  }
  requestAnimationFrame(anim);
}
function drawStar(ctx,cx,cy,sp,oR,iR) {
  let rot=(Math.PI/2)*3; const step=Math.PI/sp;
  ctx.beginPath(); ctx.moveTo(cx,cy-oR);
  for(let i=0;i<sp;i++){ctx.lineTo(cx+Math.cos(rot)*oR,cy+Math.sin(rot)*oR);rot+=step;ctx.lineTo(cx+Math.cos(rot)*iR,cy+Math.sin(rot)*iR);rot+=step;}
  ctx.lineTo(cx,cy-oR); ctx.closePath();
}

// =====================================================================
//  LOGICA
// =====================================================================
function start(id) {
  topic = TOPICS.find(t=>t.id===id);
  queue = genRound(id);
  pos = 0; errors = 0; requeued = new Set(); answered = false; selected = new Set();
  state = "playing";
  render();
}

function markMistake(q) { data.mistakes[q.key] = (data.mistakes[q.key]||0) + 1; saveData(); }
function markRight(q) {
  if (data.mistakes[q.key]) { data.mistakes[q.key] = Math.max(0, data.mistakes[q.key]-1); if(!data.mistakes[q.key]) delete data.mistakes[q.key]; saveData(); }
}

function wrong(q, solution) {
  errors++;
  markMistake(q);
  // la domanda sbagliata torna alla fine (una volta sola)
  if (!requeued.has(q.key)) { requeued.add(q.key); queue.push(q); }
  const card = $("#qcard");
  if (card) { card.style.animation="shake .5s ease-in-out"; }
  setTimeout(()=> showRule(q.rule, solution, q.say, next), 550);
}
function right(q) {
  markRight(q);
  speak(q.say);
  flashRichtig(next);
}
function next() {
  pos++; answered = false; selected = new Set();
  if (pos >= queue.length) finish(); else render();
}
function finish() {
  const stars = errors===0 ? 3 : errors<=2 ? 2 : 1;
  data.stars[topic.id] = Math.max(data.stars[topic.id]||0, stars);
  if (data.lastDate !== today()) {
    data.streak = data.lastDate===yesterday() ? data.streak+1 : 1;
    data.lastDate = today();
  }
  data.rounds++;
  saveData();
  state = "completed";
  celebrate(()=>{});
  render();
}

function choose(value) {
  const q = queue[pos];
  if (answered) return;
  answered = true;
  if (value === q.answer) right(q); else wrong(q, q.solution);
}

function checkTap() {
  const q = queue[pos];
  if (answered) return;
  answered = true;
  let ok = true;
  q.tokens.forEach((t,i) => { if (t.noun !== selected.has(i)) ok = false; });
  // mostra la soluzione direttamente nella frase
  q.tokens.forEach((t,i) => {
    const el = document.querySelector(`[data-w="${i}"]`);
    if (!el) return;
    el.classList.remove("sel");
    if (t.noun) { el.textContent = t.word + t.punct; el.classList.add(selected.has(i) ? "ok" : "miss"); }
    else if (selected.has(i)) el.classList.add("bad");
    else if (i===0) el.textContent = t.word + t.punct;
  });
  const fixed = q.tokens.map(t=>t.noun?`<b style="color:#E67E22">${esc(t.word)}</b>${esc(t.punct)}`:esc(t.word+t.punct)).join(" ");
  if (ok) setTimeout(()=>right(q), 500);
  else setTimeout(()=>wrong(q, `<span style="font-size:18px;line-height:1.6">${fixed}</span>`), 900);
}

      </div>
      ${TOPICS.map(t=>{
        const s = data.stars[t.id]||0;
        return `<button class="topic" data-topic="${t.id}" style="${t.id==='mix'?`border-color:${t.color};background:#F3F0FF`:''}">
          <span class="em">${t.emoji}</span>
          <span><div class="t" style="color:${t.color}">${t.title}</div><div class="s">${t.sub}</div></span>
          <span class="stars">${s?"⭐".repeat(s):""}</span>
        </button>`;
      }).join("")}
    </div>`;
  }

  else if (state === "playing") {
    const q = queue[pos];
    const total = queue.length;
    const progress = pos / total;
    let body = "";

    if (q.kind === "choice") {
      const opts = q.options.map((o,i)=> q.color || o.color
        ? `<button class="opt" data-opt="${i}" style="background:${o.color};box-shadow:0 4px 12px ${o.color}55">${esc(o.label)}</button>`
        : `<button class="optw" data-opt="${i}">${esc(o.label)}</button>`).join("");
      body = `
        <div style="font-family:'Nunito',sans-serif;font-size:16px;color:#888;font-weight:700;text-align:center;margin-bottom:14px">${q.ask}</div>
        <div style="font-family:'Fredoka',sans-serif;font-size:36px;font-weight:600;color:#2E4057;text-align:center;line-height:1.3;margin-bottom:8px">${q.big}</div>
        ${q.hint?`<div style="text-align:center;font-size:13px;color:#aaa;font-weight:600;margin-bottom:8px">${q.hint}</div>`:""}
        <div style="height:18px"></div>
        <div style="display:flex;${q.row?'flex-direction:row;gap:10px':'flex-direction:column;gap:10px'};justify-content:center">${opts}</div>`;
    } else if (q.kind === "tap") {
      const words = q.tokens.map((t,i)=>`<button class="word${selected.has(i)?' sel':''}" data-w="${i}">${esc(t.word.toLowerCase()+t.punct)}</button>`).join("");
      body = `
        <div style="font-family:'Nunito',sans-serif;font-size:16px;color:#888;font-weight:700;text-align:center;margin-bottom:6px">Tocca tutti i <b style="color:#E67E22">Nomen</b>!</div>
        <div style="text-align:center;font-size:13px;color:#aaa;font-weight:600;margin-bottom:14px">Quali parole vanno scritte con la maiuscola?</div>
        <div style="text-align:center;margin-bottom:22px;line-height:1.2">${words}</div>
        <button id="btn-check" style="display:block;width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#E67E22,#F5B041);color:white;font-size:20px;font-weight:600;box-shadow:0 4px 16px #E67E2244">Controlla ✓</button>`;
    }

    content = `
      <div style="margin-bottom:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:'Fredoka',sans-serif;font-size:15px;color:#888">
          <button id="btn-home" style="background:none;color:#888;font-size:15px;padding:0">← Menu</button>
          <span>${topic.emoji} ${pos+1} / ${total}</span>
          <span>${errors>0?`❌ ${errors}`:'✨'}</span>
        </div>
        <div style="height:10px;background:#eee;border-radius:10px;overflow:hidden">
          <div style="height:100%;width:${progress*100}%;background:linear-gradient(90deg,${topic.color},${topic.color}99);border-radius:10px;transition:width .5s cubic-bezier(.34,1.56,.64,1)"></div>
        </div>
      </div>
      <div id="qcard" style="flex:1;display:flex;flex-direction:column;justify-content:center;animation:fadeIn .3s ease">
        ${body}
      </div>`;
  }

  else if (state === "completed") {
    const perfect = errors===0;
    const stars = perfect ? 3 : errors<=2 ? 2 : 1;
    content = `<div style="text-align:center;padding:30px 10px;animation:fadeIn .5s ease">
      <div style="font-size:80px;margin-bottom:10px;animation:bounce 1s ease infinite">${perfect?'🏆':'🌟'}</div>
      <h1 style="font-family:'Fredoka',sans-serif;font-size:32px;color:${perfect?'#27AE60':'#E67E22'};margin:0 0 10px">${perfect?'Perfekt!':'Gut gemacht!'}</h1>
      <div style="font-size:36px;margin-bottom:10px">${"⭐".repeat(stars)}<span style="opacity:.2">${"⭐".repeat(3-stars)}</span></div>
      <p style="font-family:'Nunito',sans-serif;font-size:18px;color:#555;margin:0 0 20px">${perfect?'Nessun errore! Sei un campione! 🦖':`Hai fatto ${errors} ${errors===1?'errore':'errori'}: le parole sbagliate le ripassiamo la prossima volta!`}</p>
      <div style="display:inline-flex;align-items:center;gap:8px;background:#FFF3E0;border-radius:16px;padding:10px 18px;border:2px solid #FFB74D;margin-bottom:20px">
        <span style="font-size:24px">🔥</span><span style="font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:#E65100">${streak} ${streak===1?'giorno':'giorni'} di allenamento</span>
      </div>
      <button id="btn-again" style="display:block;width:100%;max-width:320px;margin:0 auto 12px;padding:16px;border-radius:20px;background:linear-gradient(135deg,#00b894,#55efc4);color:white;font-size:20px;font-weight:600;box-shadow:0 4px 16px #00b89444;animation:pulse 2s ease infinite">Ancora ${topic.emoji} 💪</button>
      <button id="btn-home" style="display:block;width:100%;max-width:320px;margin:0 auto;padding:14px;border-radius:20px;background:white;border:2px solid #e0e0e0;color:#666;font-size:18px;font-weight:600">Scegli un altro argomento</button>
    </div>`;
  }

  app.innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px">
      ${header}
      <div style="width:100%;max-width:500px;background:rgba(255,255,255,.92);border-radius:28px;padding:24px 20px;box-shadow:0 8px 40px rgba(0,0,0,.08);backdrop-filter:blur(12px);animation:popIn .5s cubic-bezier(.34,1.56,.64,1);flex:1;display:flex;flex-direction:column">
        ${content}
      </div>
      <div style="margin-top:16px;font-size:13px;color:rgba(0,0,0,.3);font-weight:600;text-align:center">DinoTedesco 🦕 Ripasso per la verifica · <a href="index.html" style="color:inherit">DinoMatematica</a></div>
    </div>`;

  // --- eventi ---
  document.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => start(b.dataset.topic));
  const bh = $("#btn-home"); if (bh) bh.onclick = () => { state="menu"; render(); };
  const ba = $("#btn-again"); if (ba) ba.onclick = () => start(topic.id);
  if (state === "playing") {
    const q = queue[pos];
    document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
      const o = q.options[+b.dataset.opt];
      b.style.outline = "4px solid #2E4057";
      choose(o.value);
    });
    document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
      if (answered) return;
      const i = +b.dataset.w;
      if (selected.has(i)) selected.delete(i); else selected.add(i);
      b.classList.toggle("sel");
    });
    const bc = $("#btn-check"); if (bc) bc.onclick = checkTap;
  }
}

render();
</script>
</body>
</html>
