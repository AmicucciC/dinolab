<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DinoMatematica">
<title>DinoMatematica 🦖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-height: 100vh; font-family: 'Nunito', sans-serif; overflow-x: hidden; }
input:focus { outline: none; }
button { cursor: pointer; border: none; font-family: 'Fredoka', sans-serif; }
button:active { transform: scale(0.96) !important; }
input { -webkit-appearance: none; -moz-appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
@keyframes dinoFloat { from { transform: translateY(0); } to { transform: translateY(-14px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dinoWalk { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
@keyframes goldShimmer { 0% { filter: brightness(1); } 50% { filter: brightness(1.2); } 100% { filter: brightness(1); } }
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti-canvas" style="position:fixed;inset:0;z-index:1000;pointer-events:none;display:none;"></canvas>
<div id="flying-dino" style="position:fixed;z-index:1001;pointer-events:none;font-size:64px;display:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.2));"></div>
<div id="rule-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:900;padding:20px;animation:fadeIn 0.3s ease;"></div>

<script>
// --- Config ---
const TOTAL = 10;
const DINOS = ["🦕","🦖"];
const CELEB_ITEMS = ["🦕","🦖","⭐","🌟","✨","🎉","🏆"];
const BGS = [
  "linear-gradient(135deg,#a8e6cf 0%,#dcedc1 50%,#ffd3b6 100%)",
  "linear-gradient(135deg,#f6d365 0%,#fda085 100%)",
  "linear-gradient(135deg,#a1c4fd 0%,#c2e9fb 100%)",
  "linear-gradient(135deg,#fbc2eb 0%,#a6c1ee 100%)",
  "linear-gradient(135deg,#fdcbf1 0%,#e6dee9 100%)",
];
const RULES = {
  carry: { emoji:"📦", title:"Ricorda il Riporto!", text:"Quando la somma delle unità è 10 o più, scrivi solo le unità del risultato e RIPORTA la decina alla colonna dopo!", example:"67 + 8 → 7+8=15 → scrivo 5, riporto 1 → 6+1=7 → 75", color:"#E67E22" },
  borrow: { emoji:"🏦", title:"Ricorda il Prestito!", text:"Se l'unità di sotto è più grande, chiedi in prestito una decina! L'unità di sopra diventa +10 e la decina di sopra scende di 1.", example:"35 - 27 → 5<7, non si può! → 15-7=8, 3→2, 2-2=0 → 8", color:"#CB4335" },
  units_first: { emoji:"📍", title:"Parti dalle Unità!", text:"Comincia SEMPRE dalla colonna più a destra (le unità), poi vai alle decine!", example:"35 + 27 → prima 5+7, poi 3+2", color:"#2E86C1" }
};

// --- State ---
let state = "loading";
let exercises = [];
let idx = 0;
let streak = 0;
let goldenRoar = 0;
let errors = 0;
let todaySessions = 0;  // how many rounds completed today
let phase = "units";
let unitVal = "";
let tenVal = "";
let todayDino = DINOS[Math.floor(Math.random()*DINOS.length)];
let bg = BGS[Math.floor(Math.random()*BGS.length)];

// --- Helpers ---
const today = () => new Date().toISOString().slice(0,10);
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); };
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];

function genEx() {
  if (Math.random() > 0.4) {
    const a = Math.floor(Math.random()*78)+10;
    const maxB = 99-a;
    const b = Math.floor(Math.random()*Math.min(maxB-1,49))+2;
    return {a,b,op:"+",answer:a+b};
  } else {
    const a = Math.floor(Math.random()*70)+20;
    const b = Math.floor(Math.random()*(a-5))+2;
    return {a,b,op:"−",answer:a-b};
  }
}

function detectRule(ex) {
  const uA=ex.a%10, uB=ex.b%10;
  if (ex.op==="+" && uA+uB>=10) return "carry";
  if (ex.op==="−" && uA<uB) return "borrow";
  return "units_first";
}

function genAll() {
  const exs=[]; let hasC=false,hasB=false;
  while(exs.length<TOTAL) { const e=genEx(); if(e.op==="+"&&(e.a%10)+(e.b%10)>=10)hasC=true; if(e.op==="−"&&(e.a%10)<(e.b%10))hasB=true; exs.push(e); }
  if(!hasC){ const i=exs.findIndex(e=>e.op==="+"); if(i>=0){let e; do{e=genEx();}while(e.op!=="+"||((e.a%10)+(e.b%10)<10)); exs[i]=e;} }
  if(!hasB){ const i=exs.findIndex(e=>e.op==="−"); if(i>=0){let e; do{e=genEx();}while(e.op!=="−"||((e.a%10)>=(e.b%10))); exs[i]=e;} }
  return exs;
}

// --- Storage ---
function save(ov={}) {
  const d = {
    lastDate:today(),
    streak:ov.streak??streak,
    goldenRoar:ov.goldenRoar??goldenRoar,
    errors:ov.errors??errors,
    exercises,
    exerciseIdx:ov.exerciseIdx??idx,
    completed:ov.completed||false,
    todaySessions:ov.todaySessions??todaySessions
  };
  try { localStorage.setItem("dino-math-v3", JSON.stringify(d)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem("dino-math-v3");
    const data = raw ? JSON.parse(raw) : null;
    const t = today(), y = yesterday();
    if (data && data.lastDate===t && data.completed) {
      streak=data.streak; goldenRoar=data.goldenRoar||0; errors=data.errors||0;
      todaySessions=data.todaySessions||1;
      state="completed"; render(); return;
    }
    let cs=0, cg=0, ts=0;
    if (data) {
      if (data.lastDate===y && data.completed) { cs=data.streak||0; cg=data.goldenRoar||0; }
      else if (data.lastDate===t) {
        cs=data.streak||0; cg=data.goldenRoar||0; ts=data.todaySessions||0;
        if (data.exerciseIdx!==undefined && data.exercises) {
          exercises=data.exercises; idx=data.exerciseIdx; errors=data.errors||0;
          streak=cs; goldenRoar=cg; todaySessions=ts; state="playing"; render(); return;
        }
      }
    }
    streak=cs; goldenRoar=cg; todaySessions=ts; exercises=genAll(); state="ready"; render();
  } catch { streak=0; goldenRoar=0; todaySessions=0; exercises=genAll(); state="ready"; render(); }
}

// --- Confetti ---
function celebrate(cb) {
  const canvas = $("#confetti-canvas");
  canvas.style.display="block";
  const ctx = canvas.getContext("2d");
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const colors=["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#FF9FF3","#54A0FF"];
  const parts=[];
  for(let i=0;i<80;i++) parts.push({
    x:canvas.width/2+(Math.random()-.5)*200, y:canvas.height/2,
    vx:(Math.random()-.5)*16, vy:-Math.random()*18-4,
    sz:Math.random()*10+4, c:pick(colors),
    sh:pick(["c","r","s","t"]), rot:Math.random()*Math.PI*2,
    rs:(Math.random()-.5)*.3, g:.25+Math.random()*.15, life:1, dec:.008+Math.random()*.006
  });
  const fd=$("#flying-dino");
  fd.textContent=pick(CELEB_ITEMS);
  fd.style.display="block"; fd.style.left="-80px"; fd.style.top=(canvas.height*.3+Math.random()*100)+"px";
  let fx=-80;
  let frame=0, aid;
  function anim() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    for(const p of parts) {
      if(p.life<=0)continue; alive=true;
      p.x+=p.vx; p.vy+=p.g; p.y+=p.vy; p.vx*=.99; p.rot+=p.rs; p.life-=p.dec;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.sh==="c"){ctx.beginPath();ctx.arc(0,0,p.sz,0,Math.PI*2);ctx.fill();}
      else if(p.sh==="r"){ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);}
      else if(p.sh==="s"){drawStar(ctx,0,0,5,p.sz,p.sz/2);ctx.fill();}
      else{ctx.beginPath();ctx.moveTo(0,-p.sz);ctx.lineTo(p.sz,p.sz);ctx.lineTo(-p.sz,p.sz);ctx.closePath();ctx.fill();}
      ctx.restore();
    }
    fx+=5; fd.style.left=fx+"px";
    fd.style.animation = "dinoFloat 0.5s ease-in-out infinite alternate";
    frame++;
    if(alive||frame<120) aid=requestAnimationFrame(anim);
    else { canvas.style.display="none"; fd.style.display="none"; cb(); }
  }
  aid=requestAnimationFrame(anim);
}

function drawStar(ctx,cx,cy,sp,oR,iR) {
  let rot=(Math.PI/2)*3; const step=Math.PI/sp;
  ctx.beginPath(); ctx.moveTo(cx,cy-oR);
  for(let i=0;i<sp;i++){ctx.lineTo(cx+Math.cos(rot)*oR,cy+Math.sin(rot)*oR);rot+=step;ctx.lineTo(cx+Math.cos(rot)*iR,cy+Math.sin(rot)*iR);rot+=step;}
  ctx.lineTo(cx,cy-oR); ctx.closePath();
}

// --- Rule popup ---
function showRule(key, cb) {
  const r = RULES[key];
  const ov = $("#rule-overlay");
  ov.style.display="flex";
  ov.innerHTML=`
    <div style="background:white;border-radius:24px;padding:32px;max-width:500px;width:100%;box-shadow:0 8px 32px ${r.color}44;border:4px solid ${r.color};animation:popIn .4s cubic-bezier(.34,1.56,.64,1);">
      <div style="font-size:48px;text-align:center;margin-bottom:12px">${r.emoji}</div>
      <h2 style="font-family:'Fredoka',sans-serif;color:${r.color};text-align:center;margin:0 0 16px;font-size:22px">${r.title}</h2>
      <p style="font-family:'Nunito',sans-serif;font-size:17px;line-height:1.6;color:#444;text-align:center;margin:0 0 16px">${r.text}</p>
      <div style="background:#f8f8f8;border-radius:12px;padding:14px 18px;font-family:'Fira Code',monospace;font-size:16px;font-weight:600;color:#333;text-align:center;margin-bottom:24px">${r.example}</div>
      <button id="rule-ok" style="display:block;width:100%;padding:14px;border-radius:16px;background:${r.color};color:white;font-size:20px;font-weight:600;box-shadow:0 4px 12px ${r.color}66">Ho capito! ✨</button>
    </div>`;
  $("#rule-ok").onclick = () => { ov.style.display="none"; cb(); };
}

// --- Play Again ---
function playAgain() {
  exercises = genAll();
  idx = 0;
  errors = 0;
  unitVal = "";
  tenVal = "";
  phase = "units";
  state = "playing";
  save({ exerciseIdx: 0, errors: 0, completed: false });
  render();
}

// --- Render ---
function render() {
  const app = $("#app");
  document.body.style.background = bg;
  document.body.style.minHeight = "100vh";

  const ex = exercises[idx];
  const progress = idx / TOTAL;

  const streakBadge = `<div style="display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.8);border-radius:12px;padding:6px 10px;backdrop-filter:blur(8px)"><span style="font-size:18px">🔥</span><span style="font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:${streak>0?'#E74C3C':'#999'}">${streak}</span></div>`;
  const goldenBadge = `<div style="display:flex;align-items:center;gap:4px;background:${goldenRoar>0?'rgba(255,248,225,.9)':'rgba(255,255,255,.8)'};border-radius:12px;padding:6px 10px;backdrop-filter:blur(8px);border:${goldenRoar>0?'1px solid #FFD54F':'1px solid transparent'};${goldenRoar>=3?'animation:goldShimmer 2s ease infinite':''}"><span style="font-size:18px">🦖</span><span style="font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:${goldenRoar>0?'#F9A825':'#999'}">${goldenRoar}</span></div>`;

  const header = `<div style="width:100%;max-width:500px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;animation:slideDown .4s ease">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:36px;animation:dinoWalk 1s ease-in-out infinite">${todayDino}</span>
      <div><div style="font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;color:#2E4057">DinoMatematica</div><div style="font-size:13px;color:#666;font-weight:600">Allenamento giornaliero</div></div>
    </div>
    <div style="display:flex;gap:8px">${streakBadge}${goldenBadge}</div>
  </div>`;

  let content = "";

  if (state === "loading") {
    content = `<div style="text-align:center;padding:60px 0;font-size:48px"><div style="animation:bounce 1s ease infinite">🦖</div><p style="font-size:18px;color:#888;margin-top:16px">Caricamento...</p></div>`;
  }

  else if (state === "ready") {
    let badges = "";
    if (streak > 0) badges += `<div style="background:#FFF3E0;border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:6px"><span style="font-size:20px">🔥</span><span style="font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;color:#E65100">${streak} ${streak===1?'giorno':'giorni'} di allenamento</span></div>`;
    if (goldenRoar > 0) badges += `<div style="background:#FFF8E1;border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:6px;border:1px solid #FFD54F"><span style="font-size:20px">🦖</span><span style="font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;color:#F9A825">${goldenRoar} Ruggit${goldenRoar===1?'o':'i'} d'Oro</span></div>`;

    content = `<div style="text-align:center;padding:30px 0;flex:1;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:72px;margin-bottom:16px;animation:bounce 2s ease infinite">🦖</div>
      <h1 style="font-family:'Fredoka',sans-serif;font-size:28px;color:#2E4057;margin:0 0 8px">Ciao Campione!</h1>
      <p style="font-size:18px;color:#666;margin:0 0 8px">Oggi hai ${TOTAL} esercizi da fare.</p>
      <p style="font-size:16px;color:#999;margin:0 0 24px">Scrivi prima le unità, poi le decine! 🔢</p>
      ${badges?`<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px">${badges}</div>`:''}
      <button id="btn-start" style="padding:16px 40px;border-radius:20px;background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:white;font-size:22px;font-weight:600;box-shadow:0 6px 20px #6C5CE744;animation:pulse 2s ease infinite;align-self:center">Iniziamo! 🚀</button>
    </div>`;
  }

  else if (state === "playing" && ex) {
    const dots = exercises.map((_,i) => `<div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:${i<idx?'#a29bfe33':i===idx?'#6C5CE722':'#f0f0f0'};border:${i===idx?'2px solid #6C5CE7':'2px solid transparent'};transition:all .3s ease">${i<idx?'✅':i===idx?'✏️':''}</div>`).join("");
    const opColor = ex.op==="+" ? "#27AE60" : "#E74C3C";

    const uActive = phase==="units";
    const tActive = phase==="tens";
    const uFilled = unitVal!=="";
    const tFilled = tenVal!=="";

    const boxU = `border:${uActive?'3px solid #6C5CE7':uFilled?'3px solid #a29bfe':'3px solid #e0e0e0'};background:${uActive?'#F3F0FF':'white'};box-shadow:${uActive?'0 0 0 4px #6C5CE722':'none'}`;
    const boxT = `border:${tActive?'3px solid #6C5CE7':tFilled?'3px solid #a29bfe':'3px solid #e0e0e0'};background:${tActive?'#F3F0FF':'white'};box-shadow:${tActive?'0 0 0 4px #6C5CE722':'none'}`;
    const labU = uActive ? "color:#6C5CE7;font-weight:700" : "color:#bbb;font-weight:600";
    const labT = tActive ? "color:#6C5CE7;font-weight:700" : "color:#bbb;font-weight:600";

    const tenContent = tActive
      ? `<input id="inp-ten" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" value="${tenVal}" style="width:100%;height:100%;border:none;background:transparent;font-family:'Fredoka',sans-serif;font-size:42px;font-weight:700;color:#2E4057;text-align:center;outline:none;caret-color:#6C5CE7"><div style="position:absolute;top:-10px;right:-10px;background:#6C5CE7;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;box-shadow:0 2px 6px #6C5CE744;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)">②</div>`
      : `<span style="opacity:${tFilled?1:.15}">${tFilled?tenVal:'?'}</span>`;

    const unitContent = uActive
      ? `<input id="inp-unit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" value="${unitVal}" style="width:100%;height:100%;border:none;background:transparent;font-family:'Fredoka',sans-serif;font-size:42px;font-weight:700;color:#2E4057;text-align:center;outline:none;caret-color:#6C5CE7"><div style="position:absolute;top:-10px;right:-10px;background:#6C5CE7;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;box-shadow:0 2px 6px #6C5CE744;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)">①</div>`
      : `<span>${unitVal}</span>`;

    const hint = phase==="units" ? "👆 Scrivi prima le unità!" : phase==="tens" ? "👆 Ora scrivi le decine!" : "";

    let buttons = "";
    if (phase==="tens"||phase==="confirm") buttons += `<button id="btn-reset" style="padding:14px 20px;border-radius:16px;border:2px solid #e0e0e0;background:white;color:#888;font-size:17px;font-weight:600">↩ Ricomincia</button>`;
    if (phase==="confirm") buttons += `<button id="btn-check" style="padding:14px 36px;border-radius:16px;background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:white;font-size:20px;font-weight:600;box-shadow:0 4px 16px #6C5CE744;animation:pulse 1.5s ease infinite">Controlla ✓</button>`;

    content = `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-family:'Fredoka',sans-serif;font-size:15px;color:#888">
          <span>Esercizio ${idx+1} di ${TOTAL}</span>
          <span>${errors>0?`❌ ${errors}`:'✨ Nessun errore!'}</span>
        </div>
        <div style="height:10px;background:#eee;border-radius:10px;overflow:hidden">
          <div style="height:100%;width:${progress*100}%;background:linear-gradient(90deg,#6C5CE7,#a29bfe);border-radius:10px;transition:width .5s cubic-bezier(.34,1.56,.64,1)"></div>
        </div>
        <div style="display:flex;justify-content:center;gap:6px;margin-top:12px">${dots}</div>
      </div>
      <div id="exercise-area" style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:28px">
          <span style="font-family:'Fredoka',sans-serif;font-size:52px;font-weight:700;color:#2E4057">${ex.a}</span>
          <span style="font-family:'Fredoka',sans-serif;font-size:44px;font-weight:700;color:${opColor}">${ex.op}</span>
          <span style="font-family:'Fredoka',sans-serif;font-size:52px;font-weight:700;color:#2E4057">${ex.b}</span>
          <span style="font-family:'Fredoka',sans-serif;font-size:44px;font-weight:500;color:#ccc">=</span>
        </div>
        <div id="digit-input" style="animation:none">
          <div style="display:flex;align-items:flex-start;justify-content:center;gap:20px;margin-bottom:14px">
            <div style="display:flex;flex-direction:column;align-items:center">
              <div style="width:76px;height:92px;border-radius:18px;${boxT};display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:42px;font-weight:700;color:#2E4057;transition:all .2s ease;position:relative">${tenContent}</div>
              <div style="font-family:'Fredoka',sans-serif;font-size:13px;${labT};text-align:center;margin-top:6px">Decine</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center">
              <div style="width:76px;height:92px;border-radius:18px;${boxU};display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:42px;font-weight:700;color:#2E4057;transition:all .2s ease;position:relative">${unitContent}</div>
              <div style="font-family:'Fredoka',sans-serif;font-size:13px;${labU};text-align:center;margin-top:6px">Unità</div>
            </div>
          </div>
          <div style="text-align:center;font-family:'Nunito',sans-serif;font-size:15px;color:#aaa;margin-bottom:18px;font-weight:600;min-height:22px">${hint}</div>
          <div style="display:flex;gap:10px;justify-content:center">${buttons}</div>
        </div>
      </div>`;
  }

  else if (state === "completed") {
    const perfect = errors===0;
    let goldMsg = "";
    if (perfect && goldenRoar>=3) goldMsg = `<p style="font-family:'Nunito',sans-serif;font-size:16px;color:#F9A825;font-weight:700;margin:0 0 16px">🌟 ${goldenRoar} Ruggiti d'Oro di fila! Incredibile! 🌟</p>`;
    if (!perfect) goldMsg = `<p style="font-family:'Nunito',sans-serif;font-size:15px;color:#999;margin:0 0 16px">Il Ruggito d'Oro conta i giorni perfetti senza errori. Domani riprova!</p>`;

    const sessionLabel = todaySessions === 1 ? "1 volta" : `${todaySessions} volte`;

    content = `<div style="text-align:center;padding:40px 20px;animation:fadeIn .5s ease">
      <div style="font-size:80px;margin-bottom:16px;animation:bounce 1s ease infinite">${perfect?'🏆':'🌟'}</div>
      <h1 style="font-family:'Fredoka',sans-serif;font-size:32px;color:${perfect?'#27AE60':'#E67E22'};margin:0 0 12px">${perfect?'Perfetto!':'Bravo!'}</h1>
      <p style="font-family:'Nunito',sans-serif;font-size:20px;color:#555;margin:0 0 20px">${perfect?'Nessun errore oggi! Sei un campione! 🦖':`Hai fatto ${errors} ${errors===1?'errore':'errori'}, ma hai finito tutto!`}</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:8px;background:#FFF3E0;border-radius:16px;padding:12px 20px;border:2px solid #FFB74D">
          <span style="font-size:26px">🔥</span><div style="text-align:left"><div style="font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;color:#E65100">${streak} ${streak===1?'giorno':'giorni'}</div><div style="font-family:'Nunito',sans-serif;font-size:12px;color:#BF360C;font-weight:600">Allenamento</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;background:${perfect?'#FFF8E1':'#F5F5F5'};border-radius:16px;padding:12px 20px;border:${perfect?'2px solid #FFD54F':'2px solid #E0E0E0'};${perfect&&goldenRoar>0?'animation:pulse 1.5s ease infinite':''}">
          <span style="font-size:26px">🦖</span><div style="text-align:left"><div style="font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;color:${perfect?'#F9A825':'#999'}">${goldenRoar} ${goldenRoar===1?'giorno':'giorni'}</div><div style="font-family:'Nunito',sans-serif;font-size:12px;color:${perfect?'#F57F17':'#AAA'};font-weight:600">Ruggito d'Oro</div></div>
        </div>
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;background:#E8F5E9;border-radius:12px;padding:8px 16px;margin-bottom:16px">
        <span style="font-size:18px">📝</span>
        <span style="font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:#2E7D32">Oggi: ${sessionLabel}</span>
      </div>
      ${goldMsg}
      <button id="btn-again" style="display:block;width:100%;max-width:300px;margin:16px auto 0;padding:16px 32px;border-radius:20px;background:linear-gradient(135deg,#00b894,#55efc4);color:white;font-size:20px;font-weight:600;box-shadow:0 4px 16px #00b89444;animation:pulse 2s ease infinite">Voglio allenarmi ancora! 💪</button>
      <p style="font-family:'Nunito',sans-serif;font-size:16px;color:#888;margin-top:20px">...oppure torna domani per il prossimo allenamento! 🦕</p>
    </div>`;
  }

  app.innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px">
      ${header}
      <div style="width:100%;max-width:500px;background:rgba(255,255,255,.92);border-radius:28px;padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.08);backdrop-filter:blur(12px);animation:popIn .5s cubic-bezier(.34,1.56,.64,1);flex:1;display:flex;flex-direction:column">
        ${content}
      </div>
      <div style="margin-top:16px;font-size:13px;color:rgba(0,0,0,.3);font-weight:600;text-align:center">DinoMatematica 🦕 Allenamento giornaliero</div>
    </div>`;

  // Bind events
  if (state==="ready") {
    const b=$("#btn-start"); if(b) b.onclick=()=>{ state="playing"; save({exerciseIdx:0}); render(); };
  }
  if (state==="playing") {
    const iu=$("#inp-unit"), it=$("#inp-ten");
    if(iu) { iu.focus(); iu.oninput=e=>{ const v=e.target.value.replace(/[^0-9]/g,""); if(v.length<=1){unitVal=v; if(v.length===1){phase="tens";render();}} else e.target.value=unitVal; }; }
    if(it) { it.focus(); it.oninput=e=>{ const v=e.target.value.replace(/[^0-9]/g,""); if(v.length<=1){tenVal=v; if(v.length===1){phase="confirm";render();}} else e.target.value=tenVal; };
      it.onkeydown=e=>{ if(e.key==="Backspace"&&tenVal===""){phase="units";unitVal="";render();} if(e.key==="Enter"&&tenVal!=="")doCheck(); }; }
    const br=$("#btn-reset"); if(br) br.onclick=()=>{unitVal="";tenVal="";phase="units";render();};
    const bc=$("#btn-check"); if(bc) bc.onclick=doCheck;
  }
  if (state==="completed") {
    const ba=$("#btn-again"); if(ba) ba.onclick=playAgain;
  }
}

function doCheck() {
  const t = tenVal===""?0:parseInt(tenVal,10);
  const u = parseInt(unitVal,10);
  if(isNaN(u)) return;
  const ans = t*10+u;
  const ex = exercises[idx];

  if(ans===ex.answer) {
    const nextIdx = idx+1;
    celebrate(()=>{
      if(nextIdx>=TOTAL) {
        // First completion of the day updates streaks; subsequent ones don't
        let ns = streak, ng = goldenRoar;
        if (todaySessions === 0) {
          ns = streak + 1;
          ng = errors === 0 ? goldenRoar + 1 : 0;
        }
        const newSessions = todaySessions + 1;
        streak = ns; goldenRoar = ng; todaySessions = newSessions;
        save({ completed:true, streak:ns, goldenRoar:ng, exerciseIdx:nextIdx, todaySessions:newSessions });
        state="completed"; render();
      } else {
        idx=nextIdx; unitVal=""; tenVal=""; phase="units";
        save({exerciseIdx:nextIdx}); render();
      }
    });
  } else {
    const di=$("#digit-input");
    if(di){di.style.animation="shake .5s ease-in-out"; setTimeout(()=>{if(di)di.style.animation="none";},500);}
    const ne=errors+1; errors=ne;
    const rk=detectRule(ex);
    save({errors:ne});
    setTimeout(()=>{
      showRule(rk, ()=>{ unitVal=""; tenVal=""; phase="units"; render(); });
    },600);
  }
}

// --- Init ---
load();
</script>
</body>
</html>
